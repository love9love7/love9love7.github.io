<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>问道长生 · 修仙模拟器</title>
<style>
:root{
  --ink:#e9e4d2; --ink-dim:#a9b6ad; --ink-faint:#6f7d78;
  --jade:#7ee8c9; --jade-deep:#2fbfa4; --gold:#e6c47a; --gold-deep:#b98a3e;
  --purple:#b9a6ff; --red:#ff8d8d; --bg0:#070b1e; --bg1:#101a38; --bg2:#0d2440;
  --panel:rgba(16,28,52,.72); --panel-line:rgba(126,232,201,.28);
  --serif:"STKaiti","KaiTi","Kaiti SC","FZKai-Z03S","Noto Serif SC","Songti SC","SimSun",serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--serif); color:var(--ink); overflow:hidden;
  background:radial-gradient(1200px 700px at 75% -10%, #233a66 0%, rgba(16,26,56,0) 55%),
             radial-gradient(900px 600px at -10% 110%, #123a4a 0%, rgba(10,20,40,0) 60%),
             linear-gradient(160deg, #0a0f28 0%, #101a38 45%, #0b1e33 100%);
  user-select:none;
}
/* ---------- background layers ---------- */
#sky{position:fixed; inset:0; z-index:0; overflow:hidden;}
#stars{position:absolute; inset:0;}
#moon{position:absolute; top:6vh; right:9vw; width:clamp(70px,11vmin,130px); height:clamp(70px,11vmin,130px); border-radius:50%;
  background:radial-gradient(circle at 38% 35%, #fff7e0 0%, #f7e6b0 40%, #e3c878 75%, #c9a74f 100%);
  box-shadow:0 0 40px 8px rgba(247,230,176,.45), 0 0 140px 40px rgba(227,200,120,.18);
  cursor:pointer;}
#moon::after{content:''; position:absolute; inset:0; border-radius:50%;
  background:radial-gradient(circle at 60% 55%, rgba(160,130,70,.28) 0 6%, transparent 6.5%),
             radial-gradient(circle at 44% 72%, rgba(160,130,70,.26) 0 5%, transparent 5.5%),
             radial-gradient(circle at 30% 42%, rgba(160,130,70,.22) 0 4%, transparent 4.4%);}
#moon.hit{animation:moonhit .6s;}
@keyframes moonhit{40%{transform:scale(1.12);} 70%{transform:scale(.96);}}
#clouds{position:absolute; inset:0; pointer-events:none;}
.cloud{position:absolute; background:linear-gradient(180deg, rgba(220,235,240,.16), rgba(200,220,235,.05));
  border-radius:999px; filter:blur(6px);}
#mountains{position:absolute; left:-5%; right:-5%; bottom:0; height:34vh; pointer-events:none;
  background:
    linear-gradient(115deg, transparent 44%, rgba(20,32,70,.9) 44.2% 47%, transparent 47.2%) 0 100%/16% 100% no-repeat,
    linear-gradient(65deg,  transparent 50%, rgba(16,28,58,.95) 50.2% 54%, transparent 54.2%) 0 100%/22% 100% no-repeat,
    linear-gradient(120deg, transparent 46%, rgba(26,40,84,.85) 46.2% 52%, transparent 52.2%) 0 100%/13% 100% no-repeat,
    linear-gradient(70deg,  transparent 44%, rgba(12,22,48,.96) 44.2% 58%, transparent 58.2%) 0 100%/24% 100% no-repeat;
  filter:blur(.4px);}
#mist{position:absolute; left:-10%; right:-10%; bottom:-6%; height:18vh; pointer-events:none;
  background:linear-gradient(180deg, rgba(126,232,201,0) 0%, rgba(90,160,180,.12) 45%, rgba(120,200,200,.18) 100%); filter:blur(10px);}
.tw{position:absolute; border-radius:50%; background:#fff; opacity:0;}
.shot{position:absolute; width:2px; height:2px; background:#fff; border-radius:50%; box-shadow:0 0 6px 1px rgba(255,255,255,.8); opacity:0;}
/* ---------- common ---------- */
button{font-family:var(--serif); cursor:pointer;}
#app{position:relative; z-index:5; height:100%; display:flex; flex-direction:column;}
#topbar{display:flex; align-items:center; gap:10px; padding:10px 16px; flex-wrap:wrap;
  border-bottom:1px solid rgba(126,232,201,.18); background:linear-gradient(180deg, rgba(8,14,34,.72), rgba(8,14,34,.25));}
.top-seal{font-size:13px; letter-spacing:2px; color:var(--jade); opacity:.75;}
.tbtn{background:rgba(126,232,201,.06); color:var(--ink); border:1px solid rgba(126,232,201,.35); border-radius:8px;
  padding:5px 12px; font-size:13px; letter-spacing:1px; transition:.18s;}
.tbtn:hover{background:rgba(126,232,201,.18); box-shadow:0 0 12px rgba(126,232,201,.25);}
#topname{font-size:16px; letter-spacing:2px; color:var(--gold); text-shadow:0 0 10px rgba(230,196,122,.35);}
#topright{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap;}
#main{flex:1; display:grid; grid-template-columns:280px 1fr 300px; gap:10px; padding:10px 12px; min-height:0;}
.col{min-height:0; display:flex; flex-direction:column; gap:10px;}
.panel{background:var(--panel); border:1px solid var(--panel-line); border-radius:14px; backdrop-filter:blur(6px);
  box-shadow:0 4px 24px rgba(0,0,0,.35), inset 0 0 30px rgba(126,232,201,.03); position:relative; overflow:hidden;}
.panel::before{content:''; position:absolute; inset:0 0 auto 0; height:1px; background:linear-gradient(90deg, transparent, rgba(230,196,122,.5), transparent);}
.panel-title{font-size:14px; letter-spacing:6px; color:var(--gold); padding:8px 12px 6px; text-align:center;
  border-bottom:1px dashed rgba(126,232,201,.14); text-shadow:0 0 8px rgba(230,196,122,.3);}
.scroll{overflow-y:auto; padding:8px; scrollbar-width:thin; scrollbar-color:rgba(126,232,201,.3) transparent;}
.scroll::-webkit-scrollbar{width:6px;} .scroll::-webkit-scrollbar-thumb{background:rgba(126,232,201,.25); border-radius:3px;}
/* ---------- left status ---------- */
.stat{padding:3px 2px;}
.stat .lab{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-dim); letter-spacing:1px; margin-bottom:2px;}
.stat .lab b{color:var(--ink); font-weight:normal; letter-spacing:0;}
.bar{height:7px; border-radius:4px; background:rgba(255,255,255,.07); overflow:hidden; border:1px solid rgba(255,255,255,.05);}
.bar i{display:block; height:100%; border-radius:4px; transition:width .5s ease; background:linear-gradient(90deg,#2fbfa4,#7ee8c9);}
.bar.gold i{background:linear-gradient(90deg,#b98a3e,#e6c47a);}
.bar.pur i{background:linear-gradient(90deg,#7d6bd8,#b9a6ff);}
.bar.red i{background:linear-gradient(90deg,#a04343,#ff8d8d);}
.bar.blue i{background:linear-gradient(90deg,#2f6fbf,#7ec8ff);}
.stat .lab .num{color:var(--jade); font-size:12px;}
.badges{display:flex; flex-wrap:wrap; gap:6px; padding:4px 2px;}
.badge{font-size:11.5px; color:#cfe8e0; background:rgba(126,232,201,.08); border:1px solid rgba(126,232,201,.3);
  padding:2px 8px; border-radius:999px; letter-spacing:1px;}
.badge.dark{color:#cdb8e8; background:rgba(185,166,255,.07); border-color:rgba(185,166,255,.3);}
.badge.gold{color:#f0dcae; background:rgba(230,196,122,.07); border-color:rgba(230,196,122,.32);}
#itemList{display:flex; flex-direction:column; gap:4px;}
.item{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; padding:3px 6px; border-radius:6px;
  background:rgba(255,255,255,.025); border:1px solid transparent; cursor:default;}
.item:hover{border-color:rgba(126,232,201,.25); background:rgba(126,232,201,.06);}
.item .nm{color:#dcefe7;} .item .ct{color:var(--jade); font-size:12px;}
/* ---------- center story ---------- */
#storyPanel{flex:1;}
#story{overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:8px; padding:10px 12px; min-height:0;}
#story .line{font-size:15px; line-height:1.85; letter-spacing:.6px; color:var(--ink); animation:fadein .5s ease;}
#story .line.past{color:var(--ink-faint); font-size:13.5px;}
#story .line .who{color:var(--gold); margin-right:6px;}
#story .line.act{color:var(--jade);}
#story .line.sys{color:var(--purple); font-size:13px;}
#story .line.good{color:#a8f0d8;}
#story .line.bad{color:#ffc0a8;}
#story .line.tell{color:#cfc3ff;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1;}}
#choices{padding:8px 12px 10px; border-top:1px dashed rgba(126,232,201,.16); min-height:0; overflow-y:auto;}
.choice{display:block; width:100%; text-align:left; margin:6px 0; padding:9px 12px; font-size:14.5px; letter-spacing:1px; line-height:1.5;
  color:var(--ink); background:rgba(126,232,201,.05); border:1px solid rgba(126,232,201,.28); border-radius:10px; transition:.16s;}
.choice:hover{background:rgba(126,232,201,.16); border-color:var(--jade); box-shadow:0 0 14px rgba(126,232,201,.25); transform:translateX(3px);}
.choice .hint{display:block; font-size:11.5px; color:var(--ink-faint); letter-spacing:.5px; margin-top:2px;}
.choice.warn{border-color:rgba(255,141,141,.5);}
.choice.warn:hover{background:rgba(255,141,141,.12); box-shadow:0 0 14px rgba(255,141,141,.2);}
.choice.good{border-color:rgba(126,232,201,.5);}
.choice.disabled{opacity:.45; pointer-events:none;}
.actions-note{font-size:12px; color:var(--ink-faint); text-align:center; padding:4px;}
/* ---------- right actions ---------- */
#actPanel{flex:1; min-height:0;}
#acts{overflow-y:auto; padding:6px; display:flex; flex-direction:column; gap:6px; min-height:0;}
.act{display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:8px 10px; font-size:14px; letter-spacing:1px;
  color:var(--ink); background:rgba(126,232,201,.04); border:1px solid rgba(126,232,201,.2); border-radius:9px; transition:.15s;}
.act:hover{background:rgba(126,232,201,.13); transform:translateX(-2px);}
.act .ic{width:26px; height:26px; flex:0 0 26px; display:flex; align-items:center; justify-content:center; font-size:17px;
  background:rgba(255,255,255,.05); border-radius:7px;}
.act .tx{flex:1;} .act .tx b{display:block; font-weight:normal; font-size:14px; letter-spacing:1px;}
.act .tx span{font-size:11px; color:var(--ink-faint);}
.act .tm{font-size:11px; color:var(--gold-deep);}
.act.locked{opacity:.4;}
#btkWrap{padding:8px;}
#btk{width:100%; padding:11px; font-size:16px; letter-spacing:5px; color:#081018; border:none; border-radius:11px;
  background:linear-gradient(120deg,#e6c47a,#7ee8c9); cursor:pointer; box-shadow:0 0 20px rgba(126,232,201,.35);
  animation:pulse 1.8s infinite; display:none;}
#btk:hover{filter:brightness(1.1);}
@keyframes pulse{0%,100%{box-shadow:0 0 10px rgba(126,232,201,.25);}50%{box-shadow:0 0 26px rgba(126,232,201,.6);}}
#storyPanel{display:flex; flex-direction:column;}
#story{flex:1 1 auto; min-height:0;}
#choices{flex:0 0 auto; max-height:44%;}
#rightCol .panel{display:flex; flex-direction:column;}
#rightCol .panel .panel-title{flex:0 0 auto;}
#acts{flex:1 1 auto; min-height:0;}
#btkWrap{flex:0 0 auto;}
/* ---------- overlays ---------- */
#veil{position:fixed; inset:0; z-index:40; background:rgba(5,8,20,.6); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center;}
#veil.on{display:flex;}
.modal{width:min(680px,94vw); max-height:86vh; overflow:auto; background:linear-gradient(180deg, rgba(22,34,64,.98), rgba(10,18,40,.98));
  border:1px solid rgba(126,232,201,.35); border-radius:16px; padding:22px 26px; box-shadow:0 10px 60px rgba(0,0,0,.6), inset 0 0 60px rgba(126,232,201,.05);}
.modal h2{text-align:center; color:var(--gold); letter-spacing:8px; font-size:22px; margin-bottom:14px; text-shadow:0 0 14px rgba(230,196,122,.4);}
.modal h3{color:var(--jade); letter-spacing:3px; margin:12px 0 6px; font-size:15px;}
.modal p{line-height:1.9; font-size:14.5px; color:#ddd9c8; margin:6px 0;}
.modal small{color:var(--ink-faint);}
.modal .close{display:block; margin:14px auto 0; padding:7px 22px; font-size:14px; letter-spacing:3px; color:var(--ink);
  background:rgba(126,232,201,.1); border:1px solid rgba(126,232,201,.4); border-radius:8px;}
.modal .close:hover{background:rgba(126,232,201,.22);}
/* creation */
#titleScreen{position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:radial-gradient(1000px 600px at 50% 0%, rgba(35,58,110,.4), transparent 60%), linear-gradient(165deg,#070b1e,#0c1734 55%,#081c2c);
  overflow-y:auto;}
#bigTitle{font-size:clamp(44px,9vmin,84px); letter-spacing:.18em; text-indent:.18em; color:transparent;
  background:linear-gradient(180deg,#fff6d8 20%, #e6c47a 55%, #9a7a3f 90%); -webkit-background-clip:text; background-clip:text;
  filter:drop-shadow(0 0 18px rgba(230,196,122,.35)); animation:titleFloat 5s ease-in-out infinite; text-align:center;}
@keyframes titleFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
#subTitle{letter-spacing:.5em; text-indent:.5em; color:var(--jade); margin-top:4px; font-size:clamp(12px,2vmin,16px); opacity:.8;}
#titleHint{position:absolute; bottom:18px; color:var(--ink-faint); font-size:13px; letter-spacing:2px;}
#createBox{width:min(760px,94vw); background:linear-gradient(180deg, rgba(20,32,62,.92), rgba(8,16,36,.92));
  border:1px solid rgba(126,232,201,.3); border-radius:18px; padding:20px 24px; margin:24px 0; box-shadow:0 8px 50px rgba(0,0,0,.5);}
.field{display:flex; align-items:center; gap:10px; margin:10px 0;}
.field label{color:var(--gold); letter-spacing:2px; font-size:15px; width:90px; flex:0 0 90px;}
.field input[type=text]{flex:1; background:rgba(255,255,255,.05); border:1px solid rgba(126,232,201,.3); color:var(--ink);
  font-family:var(--serif); font-size:16px; letter-spacing:2px; padding:7px 10px; border-radius:8px; outline:none;}
.field input:focus{border-color:var(--jade); box-shadow:0 0 12px rgba(126,232,201,.2);}
.optgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin:8px 0;}
.opt{text-align:left; padding:10px; border-radius:10px; background:rgba(126,232,201,.04); border:1px solid rgba(126,232,201,.18); color:var(--ink); transition:.15s;}
.opt:hover{border-color:var(--jade); background:rgba(126,232,201,.1);}
.opt.sel{border-color:var(--gold); background:rgba(230,196,122,.1); box-shadow:0 0 14px rgba(230,196,122,.2);}
.opt b{display:block; font-weight:normal; letter-spacing:2px; color:var(--gold); margin-bottom:3px;}
.opt span{font-size:11.5px; color:var(--ink-dim); line-height:1.5;}
#rootCard{margin:6px 0; padding:10px 12px; border-radius:10px; background:rgba(185,166,255,.05); border:1px dashed rgba(185,166,255,.35);}
#rootCard .rn{color:var(--purple); letter-spacing:2px;}
#createStart{display:block; margin:14px auto 0; padding:11px 44px; font-size:18px; letter-spacing:8px; color:#081018; border:none; border-radius:12px;
  background:linear-gradient(120deg,#e6c47a,#7ee8c9); cursor:pointer; box-shadow:0 0 24px rgba(126,232,201,.35);}
#createStart:hover{filter:brightness(1.1);}
/* ending overlay */
#endScreen{position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center; overflow-y:auto;
  background:radial-gradient(900px 600px at 50% 110%, rgba(70,40,20,.5), transparent 60%), linear-gradient(170deg,#0b0a14,#14102a 60%,#1c1230);}
#endScreen.on{display:flex;}
#endCard{width:min(720px,94vw); text-align:center; padding:30px 28px; border:1px solid rgba(230,196,122,.4); border-radius:18px;
  background:linear-gradient(180deg, rgba(28,22,46,.94), rgba(12,10,24,.95)); box-shadow:0 10px 70px rgba(0,0,0,.7);}
#endTag{letter-spacing:.4em; color:var(--jade); font-size:13px; opacity:.85;}
#endName{font-size:clamp(30px,6vmin,46px); letter-spacing:.2em; color:transparent; margin:10px 0 4px;
  background:linear-gradient(180deg,#fff3cf,#e6c47a 60%,#b98a3e); -webkit-background-clip:text; background-clip:text;
  filter:drop-shadow(0 0 16px rgba(230,196,122,.4));}
#endEpithet{color:var(--ink-dim); letter-spacing:3px; font-size:14px; margin-bottom:16px;}
#endStory{margin:10px auto; max-width:560px; font-size:15px; line-height:2.1; color:#e6dfca; text-align:left;}
#endStats{margin:14px auto; max-width:460px; text-align:left; font-size:13.5px; color:var(--ink-dim); line-height:2;}
#endStats b{color:var(--jade); font-weight:normal;}
#endBtns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px;}
.endbtn{padding:9px 18px; font-size:14px; letter-spacing:2px; color:var(--ink); border-radius:9px; border:1px solid rgba(126,232,201,.4);
  background:rgba(126,232,201,.08);}
.endbtn:hover{background:rgba(126,232,201,.18);}
.endbtn.primary{color:#081018; border:none; background:linear-gradient(120deg,#e6c47a,#7ee8c9); font-weight:bold;}
/* gallery */
.galGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin:6px 0 10px;}
.gal{text-align:center; padding:9px 6px; border-radius:10px; border:1px solid rgba(126,232,201,.25); background:rgba(126,232,201,.04); font-size:13px; letter-spacing:1px;}
.gal.lock{opacity:.35; border-style:dashed; border-color:rgba(255,255,255,.15); color:var(--ink-faint);}
.gal .gname{color:var(--gold); font-size:13.5px;}
.gal .gtype{display:block; font-size:10.5px; color:var(--ink-dim); margin-top:2px;}
.achi{display:flex; justify-content:space-between; padding:5px 8px; margin:3px 0; border-radius:8px; background:rgba(255,255,255,.03); font-size:13px;}
.achi .an{color:var(--ink); letter-spacing:1px;} .achi .ad{color:var(--ink-faint); font-size:11.5px;}
.achi.done{border:1px solid rgba(230,196,122,.4); background:rgba(230,196,122,.07);}
.achi.done .an{color:var(--gold);}
/* toast */
#toast{position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:90; display:flex; flex-direction:column; gap:6px; align-items:center; pointer-events:none;}
.toast{background:rgba(14,22,46,.94); border:1px solid rgba(126,232,201,.4); color:var(--jade); padding:7px 16px; border-radius:999px;
  font-size:13px; letter-spacing:1px; box-shadow:0 4px 20px rgba(0,0,0,.5); animation:toastIn .3s ease, toastOut .4s ease 2.6s forwards;}
@keyframes toastIn{from{opacity:0; transform:translateY(-10px);} }
@keyframes toastOut{to{opacity:0; transform:translateY(-8px);}}
.shopRow{display:flex; align-items:center; gap:8px; padding:6px; border-bottom:1px dashed rgba(255,255,255,.07); font-size:13.5px;}
.shopRow .sn{flex:1;} .shopRow .sp{color:var(--gold); width:90px; text-align:right;} .shopRow .si{width:60px;}
.sbtn{padding:4px 10px; font-size:12.5px; color:var(--ink); background:rgba(126,232,201,.12); border:1px solid rgba(126,232,201,.4); border-radius:7px;}
.sbtn:hover{background:rgba(126,232,201,.25);}
.sbtn:disabled{opacity:.35; cursor:not-allowed;}
.small-input{width:70px; background:rgba(255,255,255,.05); border:1px solid rgba(126,232,201,.3); color:var(--ink); font-family:var(--serif); font-size:14px; padding:3px 6px; border-radius:6px;}
.chip{display:inline-block; padding:1px 8px; margin:0 4px 4px 0; border-radius:999px; font-size:12px; letter-spacing:1px; cursor:pointer;
  background:rgba(126,232,201,.08); border:1px solid rgba(126,232,201,.3); color:#d9efe7;}
.chip:hover{background:rgba(126,232,201,.2);}
.moonline{color:var(--ink-faint); font-size:12px; text-align:center; padding:2px;}
.hidden-egg{position:fixed; left:0; bottom:0; width:6px; height:6px; opacity:0; z-index:1; pointer-events:none;}
#muteBtn,#speedBtn{width:auto;}
@media (max-width:1180px){
  #main{grid-template-columns:230px 1fr; grid-template-rows:auto 1fr;}
  #rightCol{grid-column:1/-1; flex-direction:row; flex-wrap:wrap;}
  #rightCol .panel{flex:1; min-width:220px;}
  #acts{flex-direction:row; flex-wrap:wrap;}
  .act{width:calc(50% - 4px);}
}
@media (max-width:760px){
  body{overflow-y:auto;}
  #app{height:auto; min-height:100dvh;}
  #main{display:flex; flex-direction:column; overflow:visible; padding:8px 10px;}
  .col{display:contents;}
  #storyPanel{order:1; height:56vh; min-height:340px; flex:0 0 auto;}
  #rightCol{order:2;}
  #leftCol{order:3;}
  #rightCol .panel{max-height:none;}
  #acts{flex-direction:row; flex-wrap:wrap;}
  .act{width:calc(50% - 4px);}
  .panel{backdrop-filter:none;}
  #topbar{gap:6px; padding:8px 10px; flex-wrap:wrap;}
  .tbtn{padding:6px 10px; font-size:12.5px;}
  #choices .choice{font-size:15.5px; padding:12px;}
  .modal{padding:16px;}
  #bigTitle{letter-spacing:.12em;}
  #titleHint{position:static; margin:10px 12px 16px; text-align:center;}
  #createBox{margin:14px 0;}
  .optgrid{grid-template-columns:1fr 1fr;}
}
@media (max-width:420px){
  .act{width:100%;}
  .optgrid{grid-template-columns:1fr;}
  #topname{font-size:14px;}
}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
</style>
</head>
<body>
<div id="sky">
  <div id="stars"></div>
  <div id="clouds"></div>
  <div id="moon" title="?"></div>
  <div id="mountains"></div>
  <div id="mist"></div>
</div>

<div id="app">
  <div id="topbar">
    <span class="top-seal">问道</span>
    <span id="topname">——</span>

           {t:'采摘奇花，留待炼丹', cls:'good', fx:['get zhuguo 1','get bainian 1'], log:'你小心翼翼以玉匣收好奇花，又记下此地方位，准备日后常来。'},
           {t:'在泉边结庐参悟数日', fx:['wuC 0.5','mood 5','prog 4'], log:'你在泉边一坐便是数日，任泉水打湿衣袂。灵台前所未有的清明，一些修行上的滞涩之处竟豁然开朗。'}]},
 {id:'ruins', min:1, w:9, type:'explore',
  text:'乱石堆中，你发现一座半塌的古修士洞府。石门半掩，蛛网尘封，门上依稀刻着「余窥大道而不得门，特留机缘于此，有缘者得之」字样。',
  choices:[{t:'入内一探', hint:'古修遗府，或有重宝', fx:['chance 0.3|item longzhu','chance 0.25|item qingfeng','chance 0.25|gongfa xiandao','chance 0.2|hp -25'], log:'你推开石门踏入洞府，机关与机缘并存。待你灰头土脸地出来时，怀里已多了些了不得的东西。'},
           {t:'小心为上，只在门口观望', fx:['jiyuan 3'], log:'你生性谨慎，只在门口拾了几枚散落的灵石便离去了。'}]},
 {id:'bandit', min:0, w:11, type:'walk',
  text:'官道之上，一伙悍匪正劫掠商队，哭喊声震天。为首的匪首满脸横肉，正狞笑着将刀架在一个老妇颈上。',
  choices:[{t:'出手救人，惩恶扬善', cls:'good', fx:['karma 5','chance 0.7|ls 90','chance 0.3|hp -12'], log:'你大喝一声跃入战团。一番苦战后匪众溃散，商队主人千恩万谢，硬塞给你一袋灵石。'},
           {t:'暗中相助，不露真容', fx:['karma 3','jiyuan 2'], log:'你蒙面出手，三两下打发了匪徒便飘然而去。深藏功与名，倒也别有滋味。'},
           {t:'多一事不如少一事', fx:['karma -3','mood -2'], log:'你绕道而行，身后哭喊渐远。这修仙界中，各人自有各人的命数。'}]},
 {id:'fish', min:0, w:8, type:'walk', cond:function(){return S.realm<3;},
  text:'溪边垂钓的老翁钓起一尾通体金鳞的怪鱼，鱼眼竟似人目，直勾勾望着你，口吐人言：「放我一命，赠你一场造化。」',
  choices:[{t:'放它归水', cls:'good', fx:['karma 5','chance 0.5|get longzhu'], log:'你割断鱼线，将金鳞鱼放回溪中。它甩尾潜入深潭前，回头望了你一眼，口中吐出一枚温润的珠子。'},
           {t:'出价买下，细细端详', fx:['ls -80','chance 0.5|get zhuguo 1'], log:'你花光盘缠买下怪鱼，翻来覆去研究半天，它却只是一尾寻常金鲤，你只觉血亏。'},
           {t:'请老翁烹了下酒', fx:['karma -5','hp 10','mood -4'], log:'鱼肉入口鲜美异常，你大快朵颐。可夜里总梦见那双鱼眼，幽怨地望着你。'}]},
 {id:'tea', min:0, w:9, type:'any', cond:function(){return S.realm<4;},
  text:'一间深山茶寮中，青衣老者邀你对坐。他为你斟上一盏茶，茶汤澄碧，异香扑鼻：「此茶名「忘忧」，饮之可忘却心中执念，小友可愿一试？」',
  choices:[{t:'坦然饮下', hint:'了却凡尘，道心更坚', fx:['mood 8','chance 0.3|karma 2'], log:'茶汤入喉，这些年的执念、烦忧竟如冰雪消融。你长舒一口气，灵台从未如此澄澈。'},
           {t:'婉言谢绝，只求论道', fx:['mood 4','wuC 0.3'], log:'你与老者畅谈三日三夜，从人间烟火聊到天道循环。临别时老者大笑：「心有所执，方是人；无执无念，是谓仙。小友已得三分真意。」'},
           {t:'问老者可还有更好的茶', fx:['chance 0.2|get zhuguo 1','chance 0.8|mood -2'], log:'老者哈哈大笑：「贪心不足蛇吞象！」袖中飞出几枚朱果算是点化，转瞬不见了踪影。'}]},
 {id:'beggar_secret', min:0, w:7, type:'walk',
  text:'城隍庙前，一个断了腿的乞丐忽然拉住你的衣角，压低声音：「公子，我看你印堂发亮，是修仙的苗子。我这里有半卷上古功法，只卖你三十两……不，三十灵石。」他从怀里摸出一卷泛黄的帛书，墨迹淋漓，竟似新写。',
  choices:[{t:'买下看看', fx:['ls -30','chance 0.6|gongfa wanmo','chance 0.4|lose ls 0'], log:'帛书入手，你展开一瞧，竟真是失传已久的魔道功法！乞丐已一瘸一拐地消失在人群中。'},
           {t:'断然拒绝', fx:['mood 2'], log:'你摇摇头。这年头，地摊货也敢自称上古功法了？'},
           {t:'反手举报给城中修士', cls:'good', fx:['karma 3'], log:'你唤来巡城修士，那乞丐见势不妙撒腿就跑——腿竟也不瘸了。'}]},
 {id:'sword_hermit', min:1, w:7, type:'any', once:true, cond:function(){return !S.flags.sword;},
  text:'竹林深处，一位独臂剑客正以竹代剑，舞得漫天竹叶纷飞。见你驻足，他朗声道：「小友可懂剑？」',
  choices:[{t:'恳请前辈指点剑道', hint:'或可得传剑法', fx:['chance 0.7|gongfa tiangang','chance 0.3|mood -5'], log:'独臂剑客打量你片刻，忽然一笑：「也罢，这剑诀与你有缘。」说着将一段口诀打入你识海。你只觉周身剑气纵横，锋芒毕露。'},
           {t:'摇头说自己不懂剑', fx:['mood 4','wuC 0.2'], log:'「不懂剑，好啊。」剑客笑道，「懂剑之人，一辈子都在追剑。不懂剑，才可能让剑追你。」言罢飘然而去。'}]},
 {id:'dream_old', min:1, w:6, type:'sleep', cond:function(){return S.realm>=4;},
  text:'闭关之中，你忽然神游太虚，来到一片混沌未开的天地。一位白发道人盘坐虚空，似在等你：「小友，你可知「道」字如何写？」',
  choices:[{t:'答：首走之，即是道', fx:['mood 12','wuC 0.8','prog 12'], log:'白发道人抚掌大笑：「善！道在脚下，不在天上。你且去吧。」你骤然惊醒，只觉灵台通明，修为竟精进不少。'},
           {t:'答：道可道，非常道', fx:['mood 8','wuC 0.5'], log:'道人含笑不语，化作点点灵光消散。你回味良久，若有所得。'},
           {t:'长跪不起，求道长收我为徒', fx:['mood -8'], log:'道人摇头：「求来的道，不是你的道。」话音未落，你已被踢回肉身，心中怅然若失。'}]},
 {id:'market_haggle', min:0, w:9, type:'market',
  text:'坊市的摊主是个精明的胖修士，见你面生，笑眯眯地报了个虚高价：「这位道友，此物与你有缘，一口价如何？」',
  choices:[{t:'施展三寸不烂之舌砍价', hint:'嘴皮子也是本事', fx:['chance 0.5|ls 60','chance 0.5|mood -4'], log:'一番唇枪舌剑，你最终心满意足地省下一笔灵石。胖修士哭丧着脸：「道友，你比我还会做生意！」'},
           {t:'豪爽地照价付钱', hint:'结个善缘', fx:['ls -60','jiyuan 4'], log:'你出手阔绰，胖修士大喜过望，悄悄告诉你一个坊市里的隐秘消息。'},
           {t:'只逛不买', fx:['mood 2'], log:'你闲庭信步逛了一圈，看看热闹，倒也自在。'}]},
 {id:'thunder_night', min:1, w:6, type:'any',
  text:'暴雨如注，惊雷震天。你于山巅石室中观雷，忽见一道紫电劈开夜幕，正中崖畔一株焦黑古木。雷光过处，古木竟萌发新芽，翠绿欲滴。',
  choices:[{t:'冒雨观雷悟道', hint:'雷者，天威也', fx:['mood 6','chance 0.4|wuC 0.6','chance 0.4|prog 8','chance 0.2|hp -10'], log:'你凝望雷光直至天明，隐约触摸到一丝毁灭与新生交织的天地至理。'},
           {t:'采下雷击木的新芽', fx:['get bainian 1'], log:'雷击木的新芽饱含生机，是炼制培元丹的绝佳材料。'},
           {t:'缩回石室，安然睡去', fx:['mood 3'], log:'雷雨声中，你睡得格外安稳。'}]},
 {id:'fox_spirit', min:0, w:7, type:'walk',
  text:'夜宿荒庙，你听见庙外传来女子低低的啜泣声。推门一看，月光下一位白衣女子正伏在墓碑前哭泣，衣袂飘飘，不似凡人。她抬起泪眼：「公子，妾身迷了路，可否借宿一晚？」',
  choices:[{t:'正气凛然，请她进来', fx:['chance 0.5|pet hu','chance 0.5|mood 5'], log:'翌日清晨，白衣女子已不见踪影，榻前却蹲着一只通体雪白的小狐狸，正歪头冲你眨眼。'},
           {t:'婉言谢绝，闭门不出', fx:['mood 2','jiyuan 1'], log:'你紧闭庙门，心中默念清心咒。次日出门，门前放着一枝犹带露水的白梅。'},
           {t:'暗中戒备，试探来历', fx:['wuC 0.3','chance 0.3|karma 2'], log:'你以言语试探，那女子应对如流，不露破绽。你始终未能看透她，却也未受其害。'}]},
 {id:'sect_trial', min:1, w:7, type:'sect', cond:function(){return S.sect==='qingyun';},
  text:'宗门大殿传来消息：青云宗三年一度的试炼即将开始，胜者可得宗门秘传功法《太乙青木诀》与丰厚赏赐。你作为弟子，亦有资格参加。',
  choices:[{t:'报名参加试炼', hint:'宗门扬名之机', fx:['chance 0.5|gongfa taiji','chance 0.3|ls 200','chance 0.2|hp -20'], log:'试炼凶险，你在同门中脱颖而出，最终笑到了最后。掌门亲自将秘传功法授予你，赞许道：「后生可畏！」'},
           {t:'以修行要紧为由推辞', fx:['mood 3'], log:'你安心闭关，不去争那虚名。倒也有几分淡泊明志的意味。'},
           {t:'为同门师兄助阵', fx:['karma 2','chance 0.3|ls 50'], log:'你全力相助，师兄成功夺魁，对你感激不尽，此后处处照拂于你。'}]},
 {id:'tomb', min:1, w:7, type:'explore',
  text:'深山地底，你发现一座阴气森森的古墓。墓门上刻着诡异的符文，隐隐传来锁链拖拽之声。墓道深处，似乎封印着什么了不得的东西。',
  choices:[{t:'转身离开，不碰为妙', fx:['mood 3','jiyuan 1'], log:'君子不立危墙之下。你果断离开，只当今日没来过。'},
           {t:'冒险深入，一探究竟', fx:['chance 0.35|get shehunling','chance 0.3|hp -30','chance 0.2|prog 15','chance 0.15|mo 12'], log:'墓中机关重重，你九死一生。最终你带出了一件诡异法器，代价是身上多了几道深可见骨的伤口，与一缕若有若无的阴寒之气。'},
           {t:'记下方位，来日再探', fx:['jiyuan 5'], log:'你留了个记号便退走了。冥冥中你觉得，此地与你的缘分未尽。'}]},
 {id:'sick_village', min:0, w:8, type:'walk', cond:function(){return S.realm>=1;},
  text:'路过一个山村，你发现村中瘟疫横行，尸横遍野，村民哀嚎不止。村口老族长颤巍巍跪在你面前：「仙长，求您救救我们吧！」',
  choices:[{t:'以灵力为村民驱除疫气', cls:'good', fx:['karma 8','hp -15','chance 0.4|life 2'], log:'你耗尽灵力，昼夜不停地为村民祛病。七日后疫气尽除，全村跪谢你的大恩。你虽元气大伤，却觉心头前所未有的熨帖。'},
           {t:'留下几枚丹药便走', fx:['karma 3','lose heal 1'], log:'你赠出丹药，言明自己能力有限，便匆匆离去。'},    
           {t:'凡人命数，自有天定', fx:['karma -4','mo 3'], log:'你摇摇头，转身离去。身后哭声渐远，你告诉自己：这与你无关。'}]},
 {id:'alchemist', min:0, w:6, type:'any', cond:function(){return S.realm>=1 && !S.flags.alchMaster;},
  text:'路上你偶遇一位鹤发童颜的丹道大师，他正为炼废一炉丹药而捶胸顿足，满地皆是焦黑的药渣。见你驻足，他眼睛一亮：「小友，可愿做老夫的烧火童子？管吃管住，还教你炼丹！」',
  choices:[{t:'欣然应允，侍奉左右', cls:'good', fx:['learn pozhao','learn yanshou','wuC 0.4','flag alchMaster','chance 0.4|wu 2'], log:'你在丹炉旁打杂三月，耳濡目染之下，竟也偷师到几门上乘丹方。大师临别赠你一句：「炼丹如炼心，火候到了，自然成丹。」'},
           {t:'婉拒，但求购丹方', fx:['ls -300','learn yanshou'], log:'你花重金买下一张延寿丹方，大师摇摇头：「年轻人，买来的终究不是自己的。」'},
           {t:'不感兴趣，继续赶路', fx:['jiyuan -2'], log:'你错过了一场机缘而不自知。'}]},
 {id:'swamp_demon', min:1, w:6, type:'explore',
  text:'瘴气弥漫的沼泽深处，你听见一声虚弱的呻吟。循声望去，一个浑身是血的修士正靠在一株枯树下，胸口插着一柄漆黑短刃，伤口处黑气缭绕。他艰难地抬头：「救我……我是……天煞教的人……必有重谢……」',
  choices:[{t:'拔刀救人', fx:['chance 0.5|ls 300','chance 0.3|karma -3','chance 0.2|mo 6'], log:'你费尽心力为其疗伤。那人醒来后丢给你一个储物袋，冷冷道：「今日之恩，他日必还。」言罢化作黑烟离去。袋中灵石不少，却隐隐透着一股血腥气。'},
           {t:'乘人之危，取其财物', fx:['ls 200','mo 8','karma -8'], log:'你取走他的储物袋，又补上一记，免得他日后寻仇。荒野之中，无人知晓。'},
           {t:'救他，但索要报酬', fx:['ls 150','karma 2'], log:'你为其疗伤后明码标价收了诊金。那人倒也爽快，丢下灵石便走。'}]},
 {id:'peach', min:1, w:3, type:'explore', once:true, cond:function(){return !S.flags.peach;},
  text:'峭壁之上，你竟发现一株蟠桃树！树上结着一枚粉嫩欲滴的仙桃，异香飘出十里。传说中，食蟠桃者可立地成仙，寿与天齐——只是，树下盘着一条吐着信子的青鳞巨蟒。',
  choices:[{t:'拼了！与巨蟒缠斗夺桃', hint:'富贵险中求', fx:['chance 0.5|eat peach','chance 0.5|hp -50','flag peach'], log:'一场恶斗惊天动地。最终你浑身浴血地摘下仙桃，一口咬下——甘甜的汁液入腹，天地灵气疯狂涌入！'},
           {t:'记录方位，日后实力足够再来', fx:['flag peach','jiyuan 6'], log:'你恋恋不舍地记下此地，暗下决心：这蟠桃，早晚是我的。'},
           {t:'尝试与巨蟒交涉', fx:['chance 0.2|eat peach','chance 0.8|hp -10'], log:'你试图与那巨蟒讲道理，它却不由分说地一尾扫来。你狼狈逃窜，总算保住了性命。'}]},
 {id:'fortune_teller', min:0, w:8, type:'walk',
  text:'街角一个算命摊前，瞎眼老道忽然叫住你：「道友留步！贫道观你面相，今日有一劫，亦有一缘。十灵石，贫道为你解一解。」',
  choices:[{t:'付钱听他一言', fx:['ls -10','chance 0.5|jiyuan 8','chance 0.5|mood -3'], log:'老道掐指一算，低声道：「汝之命格，贵不可言……只是……」他话未说完，一阵风吹过，摊子竟凭空消失了。你愣在原地，若有所思。'},
           {t:'一笑置之，转身离去', fx:['jiyuan 1'], log:'你只当是江湖骗术，未曾放在心上。'}]},
 {id:'cave_hermit2', min:3, w:5, type:'explore', once:true,
  text:'你无意间闯入一座灵气逼人的洞天福地。泉眼旁坐着一位看不出年岁的道姑，面前摆着一盘残局。她头也不抬：「老身在此枯等三百年，就为等一个能解此局的人。小友，可愿手谈一局？」',
  choices:[{t:'欣然落座，对弈一局', hint:'心性考验', fx:['chance 0.4|wuC 1','chance 0.3|gongfa xiandao','chance 0.3|mood -6'], log:'棋局玄妙，暗合天道。你苦思三日三夜，最终投子认负。道姑却抚掌而笑：「能在贪嗔痴中守住本心三百手，已是不易。这卷玉简，送你参悟。」'},
           {t:'自认棋力不济，婉言谢绝', fx:['mood 3','jiyuan 3'], log:'你坦承自己于棋道一窍不通。道姑轻笑：「知之为知之，不知为不知，是知也。你倒是个诚实人。」'}]},
 {id:'dragon_well', min:2, w:4, type:'explore', once:true,
  text:'村中古井忽然枯竭，村民请来你查看。你探头望去，井底深不见底，隐约有金光闪烁，耳边竟响起若有若无的龙吟。老村长说，此井是百年前一条神龙陨落之地。',

};

};

/* ================= FX 解析 ================= */
const applyFx = function(arr){
  if(!arr) return;
  for(var i=0;i<arr.length;i++) applyToken(arr[i]);
};
const applyToken = function(tok){
  tok = String(tok||'');
  if(tok.indexOf('chance ')==0){
    var m = tok.match(/^chance ([0-9.]+)\|(.*)$/);
    if(m && Math.random()<parseFloat(m[1])){
      var rest = m[2].split('|');
      for(var j=0;j<rest.length;j++) applyToken(rest[j]);
    }
    return;
  }
  var p = tok.split(' ');
  var cmd = p[0], a = p[1], b = p[2]?parseInt(p[2]):1;
  var n = parseFloat(a);
  if(cmd==='prog'){ S.progress = clamp(S.progress + n, 0, 100); }
  else if(cmd==='mood'){ S.mood = clamp(S.mood+n, 0, 100); }
  else if(cmd==='hp'){ S.hp = clamp(S.hp+n, 0, 100); }
  else if(cmd==='karma'){ S.karma = clamp(S.karma+n, -100, 150); }
  else if(cmd==='mo'){ S.mo = clamp(S.mo+n, 0, 100); }
  else if(cmd==='wu'){ S.wu = clamp(S.wu+n, 5, 100); }
  else if(cmd==='jiyuan'){ S.jiyuan = clamp(S.jiyuan+n, 0, 100); }
  else if(cmd==='life'){ S.life = Math.max(0, S.life+n); }
  else if(cmd==='ls'){ S.ls = Math.max(0, S.ls+n); if(n>0) S.stats.earn+=n; }
  else if(cmd==='partnerLove'){ S.partnerLove = clamp(S.partnerLove+n, 0, 100); }
  else if(cmd==='get'){ addItem(a, b); }
  else if(cmd==='lose'){ addItem(a, -b); }
  else if(cmd==='gongfa'){ if(a && a!==S.gongfa){ S.gongfa = a; sayLine('你参悟了功法《'+(gongfaById(a)?gongfaById(a).name:a)+'》，改修此法。','good'); if(gongfaById(a)&&gongfaById(a).mo){ S.mo=clamp(S.mo+3,0,100); sayLine('魔功噬心，魔障+3。','bad'); } } }
  else if(cmd==='pet'){ if(a && !S.pet){ S.pet=a; unlockAchi('shou'); sayLine('『'+(PETS[a]?PETS[a].name:a)+'』成为了你的伙伴。','good'); } }
  else if(cmd==='partner'){ if(a && !S.partner){ S.partner=a; S.partnerLove=30; unlockAchi('qing'); sayLine('你与'+(PARTNERS[a]?PARTNERS[a].name:a)+'结下了情缘。','good'); } }
  else if(cmd==='sect'){ if(a){ S.sect=a; sayLine('你加入了『'+(SECTS[a]?SECTS[a].name:a)+'』。','good'); } }
  else if(cmd==='flag'){ if(a) S.flags[a]=1; }
  else if(cmd==='unflag'){ if(a) delete S.flags[a]; }
  else if(cmd==='learn'){ if(a && !S.recipes[a]){ S.recipes[a]=1; var r = RECIPES.filter(function(x){return x.id===a;})[0]; sayLine('你学会了炼制「'+(r?r.name:a)+'」。','good'); } }
  else if(cmd==='wuC'){ if(Math.random()<parseFloat(a) && S.wu<80){ S.wu++; sayLine('似有所悟，悟性+1（现为 '+S.wu+'）。','good'); } }
  else if(cmd==='event'){ if(a) UI.queue.push(a); }
  else if(cmd==='end'){ if(a) endRun(a); }
  else if(cmd==='box'){ openBox(); }
  else if(cmd==='eat' && a==='peach'){ eatPeach(); }
};

const makeDynamicEvent = function(tag){
  if(tag!=='walk' && tag!=='explore' && tag!=='wander' && tag!=='any') return null;
  var L = pick(DY_LOC);
  var ty = pick(DY_TYPES);
  var txt = ty.text(L);
  var id = 'dy_' + L.length + '_' + ty.kind;
  return {id:id, min:0, w:4, type:'any', once:false, auto:false, text:txt, choices:ty.choices.slice(), dyn:true};
};
const pickEventByTag = function(tag){
  if((tag==='walk'||tag==='explore'||tag==='wander'||tag==='any') && Math.random()<0.3){
    var dp=[];
    for(var d2=0; d2<8; d2++){ var de=makeDynamicEvent(tag); if(de) dp.push(de); }
    if(dp.length) return dp[Math.floor(Math.random()*dp.length)];
  }
  var pool = [];
  for(var i=0;i<EV_ALL.length;i++){
    var ev = EV_ALL[i];
    if(!eventReady(ev)) continue;
    if(ev.type===tag || ev.type==='any') pool.push(ev);
  }
  if(tag==='walk'||tag==='explore'||tag==='wander'||tag==='any'){
    for(var d3=0; d3<6; d3++){
      var de2 = makeDynamicEvent(tag);
      if(de2) pool.push(de2);
    }
  }
  if(!pool.length) return null;
  var total=0;
  for(var j=0;j<pool.length;j++) total += (pool[j].w||1);
  var r = Math.random()*total;
  for(var k=0;k<pool.length;k++){
    r -= (pool[k].w||1);
    if(r<=0){ var hit=pool[k]; if(hit.once) S.once[hit.id]=1; return hit; }
  }
  var last=pool[pool.length-1]; if(last.once) S.once[last.id]=1; return last;
};
const maybeRandomEvent = function(tag, p){
  if(Math.random()<p){
    var ev = pickEventByTag(tag);
    if(ev){ UI.queue.push(ev.id); return true; }
  }
  return false;
};

const timePass = function(y){

const cultGain = function(mult){
  var root = rootById(S.rootId);
  var gf = gongfaById(S.gongfa) || gongfaById('jichu');
  var m = root? root.mult : 1;
  var moodF = 0.7 + S.mood/100*0.6;
  var buff = 1;
  if(hasItem('juzhen',1)) buff += 0.25;
  if(S.partner && S.partnerLove>=60) buff += 0.15;
  if(S.pet==='qingluan') buff += 0.1;
  var base = (7 + S.wu*0.13) * gf.mult * m * moodF * buff;
  var bottleneck = S.progress>80 ? 0.55 : 1;
  var g = base * mult * bottleneck;
  if(S.realm===0) g = g*0.5;
  if(gf.mo) S.mo = clamp(S.mo + 0.6*mult, 0, 100);
  if(gf.hp) S.hp = clamp(S.hp + 1.5*mult, 0, 100);
  return g;
};

const shopStock = function(){
  var list = [];
  var push = function(id, price){ list.push({id:id, price:price}); };
  push('lingcao', 12); push('bainian', 55); push('zhuguo', 160);
  push('heal', 45); push('qingxin', 95); push('juling', 130);
  if(Math.random()<0.75) push('peiyuan', 170);
  if(Math.random()<0.5) push('pozhao', 420);
  if(Math.random()<0.45) push('yanshou', 820);
  if(Math.random()<0.3) push('xisui', 1500);
  if(Math.random()<0.28) push('hufu', 380);
  if(Math.random()<0.16) push('bileizhu', 1900);
  if(Math.random()<0.2) push('qingfeng', 1800);
  if(Math.random()<0.18) push('juzhen', 1400);
  if(Math.random()<0.12) push('shehunling', 1000);
  if(Math.random()<0.14) push('dingshi', 3000);
  push('muyu', 66);
  if(S.mo>=30 && Math.random()<0.5) push('wanmo', 2000);
  if(Math.random()<0.06) push('longzhu', 66666);
  var uniq = [];
  for(var i=0;i<list.length;i++){ if(uniq.indexOf(list[i].id)<0) uniq.push(list[i].id); }
  var res = [];
  for(var j=0;j<uniq.length;j++) res.push({id:uniq[j], price:list.filter(function(x){return x.id===uniq[j];})[0].price});
  return res;
};

const runTrib = function(targetIdx, onWin, onLose){
  var type = REALMS[targetIdx]?REALMS[targetIdx].trib:'mid';
  var seq = ['thunder','heart','wind'];
  var successes = 0, wave = 0;
  var hufuUsed = false;
  var baseP = function(){
    var root = rootById(S.rootId);
    var p = 0.55 + (S.hp-50)/300 + (root&&root.trib? -root.trib:0) + (S.mood-50)/220 - S.mo/280;
    if(type==='final' || type==='huge') p -= 0.06;
    return clamp(p, 0.12, 0.94);
  };
  var adv = function(){
    if(wave>=3){
      closeModal();
      if(successes>=2) onWin(); else onLose();
      return;
    }
    var wt = seq[wave];
    var w = waveTexts[wt];
    var p = baseP();
    var opts = '';
    opts += '<button class="choice" id="tw-hard">以道心硬撼（约'+(Math.round(p*100))+'%）</button>';
    if(hasItem('bileizhu',1)){
      opts += '<button class="choice good" id="tw-lei">祭出避雷珠（约'+(Math.round(Math.min(0.95,p+0.18)*100))+'%，不消耗）</button>';
    }
    if(hasItem('pozhao',1)){
      opts += '<button class="choice good" id="tw-dan">服破障丹（约'+(Math.round(Math.min(0.96,p+0.22)*100))+'%，消耗一枚）</button>';
    }
    if(wt==='heart' && hasItem('qingxin',1)){
      opts += '<button class="choice" id="tw-qing">诵清心诀护道心（约'+(Math.round(Math.min(0.96,p+0.15)*100))+'%，消耗一枚）</button>';
    }
    var extra = (type==='final')? '此乃最后一劫，成则飞升，败则道消！' : '';
    openModal('<h2>⛈️ 渡劫 · '+(type==='small'?'小':type==='mid'?'中':type==='big'?'大':type==='huge'?'九重':type==='final'?'至圣':type==='ascend'?'天仙':'')+'天劫</h2><h3>第 '+(wave+1)+' / 3 波：'+w.t+'</h3><p>'+w.d+'</p><p style="color:var(--gold)">'+extra+'</p><div id="tribOpts">'+opts+'</div>');
    var hard = $('tw-hard'), lei = $('tw-lei'), dan = $('tw-dan'), qing = $('tw-qing');
    var tryP = function(pp, consume, label){
      closeModal();
      if(Math.random()<pp){
        successes++; sayLine('『'+w.t+'』——你扛过去了！','good');
      } else {
        sayLine('『'+w.t+'』——'+label+'……','bad');
        S.hp = clamp(S.hp-(type==='small'?8:14),0,100);
        S.mood = clamp(S.mood-7,0,100);
        if(type==='final'||type==='huge') S.life = Math.max(1,S.life-8);
        if(S.hp<=0){
          if(!hufuUsed && hasItem('dingshi',1)){ addItem('dingshi',-1); hufuUsed=true; S.hp=25; sayLine('替死玉符轰然碎裂，替你挡下了致命一击！','good'); }
          else { closeModal(); endRun('trib_death'); return; }
        }
      }
      if(consume==='pozhao') addItem('pozhao',-1);
      if(consume==='qingxin') addItem('qingxin',-1);
      wave++;
      adv();
    };
    if(hard) hard.onclick = function(){ tryP(p, null, '天威难测，你受了重创'); };

var CREATE = {origin:'sansan', root:null, rerolls:0, rollHist:[]};
const RANDOM_NAMES = ['云逸','墨尘','青玄','洛尘','苏白','楚风','叶秋','沈夜','顾长生','林晚','白鹿','玄机'];
const originName = function(id){ var o=ORIGINS.filter(function(x){return x.id===id;})[0]; return o?o.name:id; };
const rollRoot = function(){
  var total=0;
  var weights = ROOTS.map(function(r){
    var w = r.w;
    if(r.id==='tian') w += CREATE.rerolls*0.06;
    if(r.id==='dan') w += CREATE.rerolls*0.02;
    return w;
  });
  for(var i=0;i<weights.length;i++) total+=weights[i];
  var r = Math.random()*total;
  var hit = ROOTS[0];
  for(var j=0;j<ROOTS.length;j++){ r-=weights[j]; if(r<=0){ hit=ROOTS[j]; break; } }
  CREATE.root = hit.id;
  var card = $('rootCard');
  var quality = hit.mult>=1.5? '绝世之资！' : (hit.mult>=1.2? '天资卓绝' : (hit.mult>=0.9? '资质上佳':'资质平平'));
  var color = hit.cl==='紫'? '#b9a6ff' : (hit.cl==='金'?'#e6c47a':'#7ee8c9');
  card.innerHTML = '<div class="rn" style="color:'+color+'">『'+hit.name+'』 · '+quality+'</div><p style="font-size:12.5px;color:var(--ink-dim)">'+hit.desc+'</p>';
  if(CREATE.rerolls>=66 && hit.id!=='tian'){
    CREATE.root='tian';
    var t = rootById('tian');
    card.innerHTML = '<div class="rn" style="color:#e6c47a">『'+t.name+'』 · 天道垂青！</div><p style="font-size:12.5px;color:var(--ink-dim)">'+t.desc+'</p>';

};

    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    var o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    var t0 = actx.currentTime;
    var f0=660, f1=660, dur=0.15;
    if(kind==='good'){ f0=523; f1=784; dur=0.18; }
    else if(kind==='bad'){ f0=220; f1=110; dur=0.3; }
    else if(kind==='gong'){ f0=196; f1=98; dur=0.9; }
    else if(kind==='click'){ f0=880; f1=880; dur=0.06; }
    o.type='sine';
    o.frequency.setValueAtTime(f0,t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(40,f1), t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(0.12,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.start(t0); o.stop(t0+dur+0.02);
  }catch(e){}
};
